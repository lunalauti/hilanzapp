services:
  - type: web
    name: hilanzapp-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build -w @hilanzapp/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
